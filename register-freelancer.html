<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up as Freelancer - FreeMark</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
                </svg>
                FreeMark
            </a>
            <div class="nav-actions">
                <a href="register.html" class="btn btn-outline">Back to Roles</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card">
            <h2>Sign Up as a Freelancer</h2>
            <p>Build your profile and start getting hired</p>

            <form action="freelancer/profile.html" method="GET">
                <div class="form-group">
                    <label for="name">Your Full Name</label>
                    <input type="text" id="name" placeholder="John Doe" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="skills">Primary Skill</label>
                        <select id="skills" required>
                            <option value="">Select your expertise...</option>
                            <option value="frontend">Frontend Development</option>
                            <option value="backend">Backend Development</option>
                            <option value="uiux">UI/UX Design</option>
                            <option value="mobile">Mobile App Development</option>
                            <option value="data">Data Science / ML</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="rate">Expected Hourly Rate ($)</label>
                        <input type="number" id="rate" placeholder="e.g. 50" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" placeholder="you@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Create a secure password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Create Freelancer Account</button>
            </form>

            <div class="auth-links">
                <p>Already have an account? <a href="login-freelancer.html">Log in</a></p>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>
