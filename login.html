<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In - FreeMark</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
                </svg>
                FreeMark
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-outline">Back to Home</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card auth-card-wide">
            <h2>Welcome Back</h2>
            <p class="auth-subtitle">Select how you want to log in.</p>

            <div class="role-selection">
                <a href="login-client.html" class="role-card">
                    <i data-lucide="briefcase"></i>
                    <h3>Log In as Client</h3>
                </a>
                
                <a href="login-freelancer.html" class="role-card">
                    <i data-lucide="user"></i>
                    <h3>Log In as Freelancer</h3>
                </a>
            </div>
            
            <div class="admin-access">
                <a href="admin/dashboard.html">Are you an Admin?</a>
            </div>

            <div class="auth-links">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
