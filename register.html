<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - FreeMark</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .role-selection {
            display: flex;
            gap: 20px;
            margin-top: 30px;
        }
        .role-card {
            flex: 1;
            padding: 30px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-primary);
            transition: all 0.2s ease;
            background-color: var(--bg-card);
        }
        .role-card:hover {
            border-color: var(--accent);
            background-color: var(--bg-secondary);
            transform: translateY(-2px);
        }
        .role-card i {
            color: var(--accent);
            width: 48px;
            height: 48px;
            margin-bottom: 15px;
        }
        .role-card h3 {
            margin: 0 0 10px 0;
            font-size: 1.2rem;
        }
        .role-card p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin: 0;
        }
    </style>
</head>
<body>
    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>
                </svg>
                FreeMark
            </a>
            <div class="nav-actions">
                <a href="index.html" class="btn btn-outline">Back to Home</a>
            </div>
        </div>
    </header>

    <main class="auth-container">
        <div class="auth-card" style="padding: 40px; max-width: 700px;">
            <h2 style="text-align: center; margin-bottom: 10px;">Join as a client or freelancer</h2>
            <p style="text-align: center; color: var(--text-secondary);">Select the type of account you'd like to create.</p>

            <div class="role-selection">
                <a href="register-client.html" class="role-card">
                    <i data-lucide="briefcase"></i>
                    <h3>I'm a Client</h3>
                    <p>I want to hire top talent for my projects.</p>
                </a>
                
                <a href="register-freelancer.html" class="role-card">
                    <i data-lucide="user"></i>
                    <h3>I'm a Freelancer</h3>
                    <p>I want to find work and get hired.</p>
                </a>
            </div>

            <div class="auth-links" style="margin-top: 30px; text-align: center;">
                <p>Already have an account? <a href="login.html">Log in</a></p>
            </div>
        </div>
    </main>

    <script>lucide.createIcons();</script>
</body>
</html>
